sanity:
  rx_minus_antipode_ra_cosdec_arcsec_z550: 0.064   # = mu_ra* x 2z/c, sign +: mu_ra negative, earlier epoch
  tx_minus_antipode_total_arcsec: ~32.6            # = mu_total x 8.79 yr
tolerance:
  reproducibility_arcsec: 2.0
  rationale_reproducibility: >-
    Engine vs reference script: differences limited to ephemeris choice,
    UT1-UTC handling, and Sun-vs-SSB direction origin, each sub-arcsecond;
    2 arcsec gives margin without hiding an epoch-sign error (smallest
    signature: 0.064 arcsec in RA*cos(dec) between rx and antipode at
    z=550 — the ROLE EPOCHS themselves are checked to 1e-6 day).
  publication_consistency_arcmin: 15.0
  rationale_publication: >-
    Paper coordinates are read from a figure; representative time vs actual
    scan times contributes intra-day parallax motion; beam-scale agreement
    (GBT L-band FWHM ~9 arcmin) is the meaningful criterion.
