# Published-search epoch anchor: Tusay et al. (2022) Alpha Centauri
# GBT session, UT 2021 November 6 (arXiv:2206.14807).
#
# Two comparisons ride on this fixture:
#  1. REPRODUCIBILITY (primary, tight): the Phase 4 engine must reproduce the
#     frozen values below, which come from tusay_eq57_reference.py — an
#     independent, no-abstraction astropy transcription of the published
#     equations 5-7 run 2026-08-17 (approximations documented in that
#     script's docstring: builtin ephemeris, bundled IERS, SSB-origin target
#     direction, TDB-assumed catalog epoch).
#  2. PUBLICATION CONSISTENCY (loose): the antipode line of sight must fall
#     in the paper's pointing region (their Figure 3; exact coordinates are
#     not tabulated in the text). The paper targeted alpha Cen A, noting the
#     A/B separation (<10 arcsec) is far below the GBT beam.
#
# The paper restricts probe placement to z < d/10 and neglects Solar motion
# during Sun-probe light travel (stated effect ~0.1 arcsec); this model
# inherits both.
