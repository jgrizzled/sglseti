# Example curated target registry for sglseti demonstrating the richer
# provider families and provenance features (schema version 2).
#
# SAMPLE VALUES FOR DEMONSTRATION ONLY — not vetted for operational use.
# Revalidate every value against an immutable catalog or literature release
# before any scientific calculation.
#
# Shown here: explicit target-state provider selection, immutable
# catalog/literature identifiers, per-value provenance with uncertainties
# and units, covariance/correlation matrices with a declared parameter
# ordering, and quality/model-selection metadata. See docs/registry.md.
schema_version: 2

targets:
  alpha-cen-ab:
    display_name: "Alpha Centauri AB barycenter"
    endpoint_kind: barycenter
    priority: 1.0
    tags: [tier1, binary-system]
    notes: >-
      System barycenter of the Alpha Centauri AB pair. The state.astrometry
      block describes the barycenter itself; the orbit block records the
      adopted relative solution so the same content hash covers it.
    identifiers:
      - catalog: "Pourbaix & Boffin"
        id: "alpha Cen AB combined solution"
        version: "2016, A&A 586, A90"
    quality: "published combined visual/RV solution"
    model_rationale: >-
      A bright resolved binary has no Gaia five-parameter solution; the
      published two-body orbit about a linearly moving barycenter is the
      appropriate model (improvements note section 2.1).
    state:
      provider: two_body_orbit_v1
      astrometry:
        frame: icrs
        ra_deg: 219.90206543
        dec_deg: -60.83399269
        pm_ra_cosdec_mas_per_yr: -3620.0
        pm_dec_mas_per_yr: 694.0
        parallax_mas: 743.0
        radial_velocity_km_s: -22.390
        reference_epoch_jyear: 2000.0
        reference_epoch_scale: tdb
        source: >-
          Demonstration barycenter snapshot; parallax and systemic radial
          velocity from Pourbaix & Boffin 2016 as tabulated by Akeson et
          al. 2021, AJ 162, 14, Table 8
      provenance:
        parallax_mas:
          source: "Pourbaix & Boffin 2016 via Akeson et al. 2021 Table 8"
          uncertainty: 1.3
          unit: mas
        radial_velocity_km_s:
          source: "Pourbaix & Boffin 2016 via Akeson et al. 2021 Table 8"
          uncertainty: 0.0042
          unit: km/s
      orbit:
        period_yr: 79.91
        periastron_epoch_jyear: 1955.66
        eccentricity: 0.524
        semimajor_axis_arcsec: 17.66
        inclination_deg: 79.32
        ascending_node_deg: 204.85
        arg_periastron_deg: 232.3
        mass_fraction_secondary: 0.4617
        component: barycenter
        source: >-
          Pourbaix & Boffin 2016, A&A 586, A90, as tabulated by Akeson et
          al. 2021, AJ 162, 14, Table 8

  alpha-cen-a:
    display_name: "Alpha Centauri A"
    endpoint_kind: component
    priority: 1.0
    tags: [tier1, binary-component]
    notes: >-
      Resolved primary component: the barycenter astrometry plus the
      published relative orbit scaled by the secondary mass fraction.
    identifiers:
      - catalog: HIP
        id: "71683"
        version: "Hipparcos, the New Reduction (van Leeuwen 2007)"
    state:
      provider: two_body_orbit_v1
      astrometry:
        frame: icrs
        ra_deg: 219.90206543
        dec_deg: -60.83399269
        pm_ra_cosdec_mas_per_yr: -3620.0
        pm_dec_mas_per_yr: 694.0
        parallax_mas: 743.0
        radial_velocity_km_s: -22.390
        reference_epoch_jyear: 2000.0
        reference_epoch_scale: tdb
        source: >-
          Demonstration barycenter snapshot; parallax and systemic radial
          velocity from Pourbaix & Boffin 2016 as tabulated by Akeson et
          al. 2021, AJ 162, 14, Table 8
      orbit:
        period_yr: 79.91
        periastron_epoch_jyear: 1955.66
        eccentricity: 0.524
        semimajor_axis_arcsec: 17.66
        inclination_deg: 79.32
        ascending_node_deg: 204.85
        arg_periastron_deg: 232.3
        mass_fraction_secondary: 0.4617
        component: primary
        source: >-
          Pourbaix & Boffin 2016, A&A 586, A90, as tabulated by Akeson et
          al. 2021, AJ 162, 14, Table 8

  accel-demo:
    display_name: "Acceleration-solution demonstration star"
    endpoint_kind: star
    priority: 0.5
    tags: [demonstration]
    flags: [accelerating_system]
    notes: >-
      Demonstrates a catalog acceleration solution (e.g. a Hipparcos-Gaia
      long-baseline fit). The accelerating_system flag is rejected for the
      linear family but accepted here — modeling it is this family's point.
    state:
      provider: acceleration_astrometry_v1
      astrometry:
        frame: icrs
        ra_deg: 100.0
        dec_deg: -20.0
        parallax_mas: 50.0
        pm_ra_cosdec_mas_per_yr: 120.0
        pm_dec_mas_per_yr: -80.0
        radial_velocity_km_s: 12.0
        reference_epoch_jyear: 2016.0
        reference_epoch_scale: tcb
        source: "demonstration values only"
      acceleration:
        accel_ra_cosdec_mas_per_yr2: 0.9
        accel_dec_mas_per_yr2: -0.4
        source: "demonstration values only"
      covariance:
        parameters: [pm_ra_cosdec, pm_dec]
        units: [mas/yr, mas/yr]
        kind: correlation
        matrix:
          - [1.0, -0.2]
          - [-0.2, 1.0]
