[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sgl-search-planner"
version = "0.1.0"
description = "Targeted telescope pointing planner and observation ledger for Solar Gravitational Lens technosignature searches"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "OpenAI"}]
dependencies = [
  "astropy>=7.0,<9",
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
catalog = ["astroquery>=0.4.11"]
test = ["pytest>=8"]

[project.scripts]
sgl-search = "sgl_search.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sgl_search*"]
