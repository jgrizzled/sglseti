schema_version: 1
campaign_id: "demo-kitt-peak-2026-12-15"
geometry_model: "tusay2022"

# 'builtin' works without a downloaded kernel. For a real campaign, use a pinned
# local JPL SPK path or a named DE kernel and record its checksum.
ephemeris: "builtin"
iers_auto_download: true

site:
  name: "Example Kitt Peak site"
  longitude_deg: -111.6003
  latitude_deg: 31.9583
  elevation_m: 2096

night:
  start_utc: "2026-12-15T01:00:00"
  end_utc: "2026-12-15T13:00:00"
  grid_minutes: 10

instrument:
  telescope_id: "example-optical-01"
  fov:
    shape: "circle"
    diameter_arcmin: 8.0
    usable_fraction: 0.85
  corridor_half_width_arcsec: 20.0
  exposure_seconds: 300
  overhead_seconds: 60

constraints:
  min_altitude_deg: 25
  max_sun_altitude_deg: -12
  min_moon_separation_deg: 20

profile:
  profile_id: "optical-pulse-r-v1"
  signal_class: "optical-pulse"
  band: "r"
  required_successful_visits: 2
  min_visit_separation_days: 7
  min_quality: 0.8

selection:
  - target_id: "barnard"
    roles: [receiver, transmitter]
    range_au:
      min: 550
      max: 2500
    partition:
      kind: "inverse_range"
      step_arcsec: 15
    include_cells: []
    exclude_cells: []

output:
  include_invisible: false
