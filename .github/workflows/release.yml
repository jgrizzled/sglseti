name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Check tag matches package version
        run: |
          pkg="$(sed -nE 's/^__version__ = "([^"]+)"$/\1/p' sglseti/__init__.py)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "Tag v$tag does not match package version $pkg" >&2
            exit 1
          fi
      - name: Build
        run: uv build
      - name: Publish to PyPI
        run: uv publish
